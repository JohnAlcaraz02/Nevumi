name: SleepMusic
options:
  bundleIdPrefix: com.johnalcaraz
packages:
  DynamicNotchKit:
    url: https://github.com/MrKai77/DynamicNotchKit
    exactVersion: 1.1.0
  SkyLightWindow:
    url: https://github.com/Lakr233/SkyLightWindow
    exactVersion: 1.0.0
targets:
  SleepMusic:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: SleepMusic
    dependencies:
      - package: DynamicNotchKit
      - package: SkyLightWindow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnalcaraz.SleepMusic
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Sleep Music
        NSHumanReadableCopyright: "Personal use only"
        NSAppleEventsUsageDescription: "Sleep Music reads the currently playing track from Spotify to show it as Now Playing."
        LSUIElement: true
    entitlements:
      path: Generated/SleepMusic.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
        com.apple.security.automation.apple-events: true
