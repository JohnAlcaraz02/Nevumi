name: Nevumi
options:
  bundleIdPrefix: com.johnalcaraz
packages:
  DynamicNotchKit:
    url: https://github.com/MrKai77/DynamicNotchKit
    exactVersion: 1.1.0
  SkyLightWindow:
    url: https://github.com/Lakr233/SkyLightWindow
    exactVersion: 1.0.0
targets:
  Nevumi:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Nevumi
    dependencies:
      - package: DynamicNotchKit
      - package: SkyLightWindow
    settings:
      base:
        PRODUCT_NAME: Nevumi
        PRODUCT_BUNDLE_IDENTIFIER: com.johnalcaraz.SleepMusic
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Nevumi
        NSHumanReadableCopyright: "Personal use only"
        NSAppleEventsUsageDescription: "Nevumi reads the currently playing track from Spotify to show it as Now Playing."
        NSCalendarsWriteOnlyAccessUsageDescription: "Nevumi adds the calendar notes and events you create in Quick Assistant."
        LSUIElement: true
    entitlements:
      path: Generated/Nevumi.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
        com.apple.security.automation.apple-events: true
schemes:
  Nevumi:
    build:
      targets:
        Nevumi: all
    run:
      config: Debug
    archive:
      config: Release
